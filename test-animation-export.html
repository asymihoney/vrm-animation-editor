<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRM Player - Auto Fixer</title>
    <style>
        body { margin: 0; background: #111; color: #fff; font-family: sans-serif; overflow: hidden; }
        #canvas { width: 100vw; height: 100vh; display: block; }
        .controls {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0, 0, 0, 0.9); padding: 20px;
            border-radius: 15px; width: 300px; border: 1px solid #333;
        }
        .btn {
            background: #2563eb; color: white; border: none; padding: 12px;
            border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px;
            font-weight: bold; transition: 0.2s;
        }
        .btn:hover { background: #1d4ed8; }
        .btn-play { background: #059669; }
        .btn-play:disabled { background: #333; cursor: not-allowed; }
        .status { 
            font-size: 12px; padding: 10px; border-radius: 8px; 
            background: #1a1a1a; border-left: 4px solid #2563eb; margin-bottom: 10px;
        }
        .info { font-size: 11px; color: #888; margin-top: 10px; line-height: 1.5; }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="controls">
    <div class="status" id="status">Silakan load file VRM & Animasi</div>
    
    <label style="font-size: 10px; color: #666;">STEP 1</label>
    <button class="btn" onclick="document.getElementById('vrmInput').click()">📂 Load Model VRM</button>
    <input type="file" id="vrmInput" accept=".vrm" style="display:none">

    <label style="font-size: 10px; color: #666; margin-top: 15px; display: block;">STEP 2</label>
    <button class="btn" onclick="document.getElementById('animInput').click()">🎬 Load File Export (.js/.txt)</button>
    <input type="file" id="animInput" accept=".js,.txt" style="display:none">

    <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">

    <button class="btn btn-play" id="playBtn" disabled>▶ MULAI ANIMASI</button>
    
    <div id="debugInfo" class="info"></div>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.1.6/lib/three-vrm.module.js"
    }
}
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

    let currentVRM = null;
    let animationData = null;
    let isPlaying = false;
    let startTime = 0;

    // --- Basic Three.js Setup ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 20);
    camera.position.set(0, 1.4, 3);
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const light = new THREE.DirectionalLight(0xffffff, 1.2);
    light.position.set(1, 1, 1);
    scene.add(light);
    scene.add(new THREE.GridHelper(10, 10));

    // --- Parser Intuitif ---
    document.getElementById('animInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            try {
                let content = event.target.result;

                // 1. Ambil data di antara { dan } saja
                const start = content.indexOf('{');
                const end = content.lastIndexOf('}');
                if (start === -1) throw new Error("Tidak ditemukan simbol {");
                let jsonStr = content.substring(start, end + 1);

                // 2. BERSIHKAN KOMPAR: Hapus koma berlebih sebelum penutup kurung
                // Ini yang sering bikin JSON.parse error di file export
                jsonStr = jsonStr.replace(/,[ \t\r\n]*([}\]])/g, '$1');

                // 3. Coba parsing
                animationData = JSON.parse(jsonStr);

                document.getElementById('status').textContent = "✅ Animasi Siap!";
                document.getElementById('debugInfo').innerHTML = `Nama: ${animationData.name}<br>Durasi: ${animationData.duration}s`;
                if (currentVRM) document.getElementById('playBtn').disabled = false;
            } catch (err) {
                console.error(err);
                alert("Gagal memproses file animasi! Error: " + err.message);
                document.getElementById('status').textContent = "❌ File Animasi Rusak";
            }
        };
        reader.readAsText(file);
    });

    // --- Loader VRM ---
    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));

    document.getElementById('vrmInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        document.getElementById('status').textContent = "⏳ Memuat VRM...";
        try {
            const url = URL.createObjectURL(file);
            const gltf = await loader.loadAsync(url);
            if (currentVRM) scene.remove(currentVRM.scene);
            currentVRM = gltf.userData.vrm;
            VRMUtils.rotateVRM0(currentVRM);
            scene.add(currentVRM.scene);
            document.getElementById('status').textContent = "✅ Model Ready";
            if (animationData) document.getElementById('playBtn').disabled = false;
        } catch (err) {
            alert("Gagal load VRM!");
        }
    });

    document.getElementById('playBtn').addEventListener('click', () => {
        isPlaying = true;
        startTime = Date.now();
        document.getElementById('status').textContent = "🏃 Animasi Berjalan...";
    });

    // --- Core Logic ---
    function applyPose(vrm, pose) {
        if (!vrm || !vrm.humanoid || !pose) return;
        Object.entries(pose).forEach(([boneName, data]) => {
            const bone = vrm.humanoid.getNormalizedBoneNode(boneName);
            if (bone && data.rotation) bone.rotation.fromArray(data.rotation);
        });
    }

    function animate() {
        requestAnimationFrame(animate);
        if (currentVRM) {
            currentVRM.update(1/60);
            if (isPlaying && animationData) {
                const time = ((Date.now() - startTime) / 1000) % animationData.duration;
                
                // Simple Interpolation
                const kfs = animationData.keyframes;
                let i = 0;
                while (i < kfs.length - 2 && time > kfs[i+1].time) i++;
                
                const prev = kfs[i];
                const next = kfs[i+1];
                const t = (time - prev.time) / (next.time - prev.time);
                
                const pose = {};
                Object.keys(prev.bones).forEach(bone => {
                    const q1 = new THREE.Quaternion().setFromEuler(new THREE.Euler(...prev.bones[bone].rotation));
                    const q2 = new THREE.Quaternion().setFromEuler(new THREE.Euler(...(next.bones[bone]?.rotation || prev.bones[bone].rotation)));
                    const qRes = q1.slerp(q2, t);
                    const e = new THREE.Euler().setFromQuaternion(qRes);
                    pose[bone] = { rotation: [e.x, e.y, e.z] };
                });
                
                applyPose(currentVRM, pose);
            }
        }
        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
